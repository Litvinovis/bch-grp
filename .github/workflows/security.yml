name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Еженедельно в понедельник

jobs:
  sast:
    name: SAST — SpotBugs + FindSecBugs
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      # Проект собирается под Java 25: с JDK 21 компиляция падала, а без compile
      # spotbugs:check не находил классов — SAST фактически ничего не проверял
      - name: Set up Java 25
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-25-openjdk-amd64/bin" >> $GITHUB_PATH
      - name: Run SpotBugs
        run: mvn -B compile spotbugs:check -Dmaven.test.skip=true --no-transfer-progress
        continue-on-error: true
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

  sca:
    name: SCA (Trivy)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        # Закреплено на коммите релиза v0.36.0: плавающая ветка master — риск supply-chain атаки
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt
          retention-days: 30
